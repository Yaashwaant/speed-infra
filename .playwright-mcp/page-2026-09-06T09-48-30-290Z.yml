    - generic [ref=f4e36]:
      - generic [ref=f4e37]:
        - paragraph [ref=f4e38]: Our Vision
        - heading "We build where others won't." [level=3] [ref=f4e39]
        - paragraph [ref=f4e40]: "\"The good land is never the obvious land. We look past the highway, past the brand name, past the brochure, and we walk the site ourselves.\""
        - paragraph [ref=f4e41]: Speed Infra has been turning overlooked parcels into working neighborhoods near Hyderabad for over a decade. We do this slowly, one site at a time, with the same team from foundation to handover.
        - paragraph [ref=f4e42]: When you walk into one of our communities, the road is paved, the water runs, and the lights are on. That is the only proof we offer.
        - paragraph [ref=f4e43]: The Speed Infra team
      - img "A Speed Infra community at first light, viewed from above" [ref=f4e46]
    - generic [ref=f4e47]:
      - generic [ref=f4e48]:
        - paragraph [ref=f4e49]: How we build
        - heading "Three steps. No surprises." [level=2] [ref=f4e50]
        - paragraph [ref=f4e51]: From the first walk across a bare field to the day you collect your keys, the same team carries the work.
      - generic [ref=f4e52]:
        - article [ref=f4e53]:
          - generic [ref=f4e54]: "01"
          - generic [ref=f4e55]:
            - heading "Scout the land" [level=3] [ref=f4e56]
            - paragraph [ref=f4e57]: We walk the site in the rain, check the borewells, time the drive to the airport. If the answer to any of those is wrong, we walk away.
        - article [ref=f4e58]:
          - generic [ref=f4e59]: "02"
          - generic [ref=f4e60]:
            - heading "Draw the plan twice" [level=3] [ref=f4e61]
            - paragraph [ref=f4e62]: Plans get drawn once, then redrawn. Road width, water line, sun angle, parking. The blueprint you sign is the second one, and it is the one we trust.
        - article [ref=f4e63]:
          - generic [ref=f4e64]: "03"
          - generic [ref=f4e65]:
            - heading "Build with one crew" [level=3] [ref=f4e66]
            - paragraph [ref=f4e67]: One site, one supervisor, one crew. The same hands that poured the foundation hand you the keys. We send photos every Friday until handover day.
    - generic [ref=f4e68]:
      - generic [ref=f4e69]:
        - paragraph [ref=f4e70]: What we do not compromise
        - heading "Three quiet promises." [level=2] [ref=f4e71]
      - generic [ref=f4e72]:
        - article [ref=f4e73]:
          - heading "Twenty minutes to the airport" [level=3] [ref=f4e78]
          - paragraph [ref=f4e79]: Every project sits within a short drive of Rajiv Gandhi International Airport. No surprise traffic on moving day, no surprise tolls on the way home.
        - article [ref=f4e80]:
          - heading "Every plot, every document" [level=3] [ref=f4e84]
          - paragraph [ref=f4e85]: RERA registered, layout approved, title clear, file ready before you sign. The paperwork is boring on purpose, and it ships with the keys.
        - article [ref=f4e86]:
          - heading "Built for thirty years" [level=3] [ref=f4e90]
          - paragraph [ref=f4e91]: Foundations sized for three stories, water lines sized for a city block, electric mains ready for the EV future. We build once and we build right.

          - heading "Twenty minutes to the airport" [level=3] [ref=f1e76]
          - paragraph [ref=f1e77]: Every project sits within a short drive of Rajiv Gandhi International Airport. No surprise traffic on moving day, no surprise tolls on the way home.
        - article [ref=f1e78]:
          - heading "Every plot, every document" [level=3] [ref=f1e82]
          - paragraph [ref=f1e83]: RERA registered, layout approved, title clear, file ready before you sign. The paperwork is boring on purpose, and it ships with the keys.
        - article [ref=f1e84]:
          - heading "Built for thirty years" [level=3] [ref=f1e88]
          - paragraph [ref=f1e89]: Foundations sized for three stories, water lines sized for a city block, electric mains ready for the EV future. We build once and we build right.

    - generic [ref=f1e34]:
      - generic [ref=f1e35]:
        - paragraph [ref=f1e36]: Our Vision
        - heading "We build where others won't." [level=3] [ref=f1e37]
        - paragraph [ref=f1e38]: "\"The good land is never the obvious land. We look past the highway, past the brand name, past the brochure, and we walk the site ourselves.\""
        - paragraph [ref=f1e39]: Speed Infra has been turning overlooked parcels into working neighborhoods near Hyderabad for over a decade. We do this slowly, one site at a time, with the same team from foundation to handover.
        - paragraph [ref=f1e40]: When you walk into one of our communities, the road is paved, the water runs, and the lights are on. That is the only proof we offer.
        - paragraph [ref=f1e41]: The Speed Infra team
      - img "A Speed Infra community at first light, viewed from above" [ref=f1e44]
    - generic [ref=f1e45]:
      - generic [ref=f1e46]:
        - paragraph [ref=f1e47]: How we build
        - heading "Three steps. No surprises." [level=2] [ref=f1e48]
        - paragraph [ref=f1e49]: From the first walk across a bare field to the day you collect your keys, the same team carries the work.
      - generic [ref=f1e50]:
        - article [ref=f1e51]:
          - generic [ref=f1e52]: "01"
          - generic [ref=f1e53]:
            - heading "Scout the land" [level=3] [ref=f1e54]
            - paragraph [ref=f1e55]: We walk the site in the rain, check the borewells, time the drive to the airport. If the answer to any of those is wrong, we walk away.
        - article [ref=f1e56]:
          - generic [ref=f1e57]: "02"
          - generic [ref=f1e58]:
            - heading "Draw the plan twice" [level=3] [ref=f1e59]
            - paragraph [ref=f1e60]: Plans get drawn once, then redrawn. Road width, water line, sun angle, parking. The blueprint you sign is the second one, and it is the one we trust.
        - article [ref=f1e61]:
          - generic [ref=f1e62]: "03"
          - generic [ref=f1e63]:
            - heading "Build with one crew" [level=3] [ref=f1e64]
            - paragraph [ref=f1e65]: One site, one supervisor, one crew. The same hands that poured the foundation hand you the keys. We send photos every Friday until handover day.
    - generic [ref=f1e66]:
      - generic [ref=f1e67]:
        - paragraph [ref=f1e68]: What we do not compromise
        - heading "Three quiet promises." [level=2] [ref=f1e69]
      - generic [ref=f1e70]:

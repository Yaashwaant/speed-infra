    - generic [ref=f3e36]:
      - generic [ref=f3e37]:
        - paragraph [ref=f3e38]: Our Vision
        - heading "We build where others won't." [level=3] [ref=f3e39]
        - paragraph [ref=f3e40]: "\"The good land is never the obvious land. We look past the highway, past the brand name, past the brochure, and we walk the site ourselves.\""
        - paragraph [ref=f3e41]: Speed Infra has been turning overlooked parcels into working neighborhoods near Hyderabad for over a decade. We do this slowly, one site at a time, with the same team from foundation to handover.
        - paragraph [ref=f3e42]: When you walk into one of our communities, the road is paved, the water runs, and the lights are on. That is the only proof we offer.
        - paragraph [ref=f3e43]: The Speed Infra team
      - img "A Speed Infra community at first light, viewed from above" [ref=f3e46]
    - generic [ref=f3e47]:
      - generic [ref=f3e48]:
        - paragraph [ref=f3e49]: How we build
        - heading "Three steps. No surprises." [level=2] [ref=f3e50]
        - paragraph [ref=f3e51]: From the first walk across a bare field to the day you collect your keys, the same team carries the work.
      - generic [ref=f3e52]:
        - article [ref=f3e53]:
          - generic [ref=f3e54]: "01"
          - generic [ref=f3e55]:
            - heading "Scout the land" [level=3] [ref=f3e56]
            - paragraph [ref=f3e57]: We walk the site in the rain, check the borewells, time the drive to the airport. If the answer to any of those is wrong, we walk away.
        - article [ref=f3e58]:
          - generic [ref=f3e59]: "02"
          - generic [ref=f3e60]:
            - heading "Draw the plan twice" [level=3] [ref=f3e61]
            - paragraph [ref=f3e62]: Plans get drawn once, then redrawn. Road width, water line, sun angle, parking. The blueprint you sign is the second one, and it is the one we trust.
        - article [ref=f3e63]:
          - generic [ref=f3e64]: "03"
          - generic [ref=f3e65]:
            - heading "Build with one crew" [level=3] [ref=f3e66]
            - paragraph [ref=f3e67]: One site, one supervisor, one crew. The same hands that poured the foundation hand you the keys. We send photos every Friday until handover day.
    - generic [ref=f3e68]:
      - generic [ref=f3e69]:
        - paragraph [ref=f3e70]: What we do not compromise
        - heading "Three quiet promises." [level=2] [ref=f3e71]
      - generic [ref=f3e72]:
        - article [ref=f3e73]:
          - heading "Twenty minutes to the airport" [level=3] [ref=f3e78]
          - paragraph [ref=f3e79]: Every project sits within a short drive of Rajiv Gandhi International Airport. No surprise traffic on moving day, no surprise tolls on the way home.
        - article [ref=f3e80]:
          - heading "Every plot, every document" [level=3] [ref=f3e84]
          - paragraph [ref=f3e85]: RERA registered, layout approved, title clear, file ready before you sign. The paperwork is boring on purpose, and it ships with the keys.
        - article [ref=f3e86]:
          - heading "Built for thirty years" [level=3] [ref=f3e90]
          - paragraph [ref=f3e91]: Foundations sized for three stories, water lines sized for a city block, electric mains ready for the EV future. We build once and we build right.

          - heading "Twenty minutes to the airport" [level=3] [ref=f2e78]
          - paragraph [ref=f2e79]: Every project sits within a short drive of Rajiv Gandhi International Airport. No surprise traffic on moving day, no surprise tolls on the way home.
        - article [ref=f2e80]:
          - heading "Every plot, every document" [level=3] [ref=f2e84]
          - paragraph [ref=f2e85]: RERA registered, layout approved, title clear, file ready before you sign. The paperwork is boring on purpose, and it ships with the keys.
        - article [ref=f2e86]:
          - heading "Built for thirty years" [level=3] [ref=f2e90]
          - paragraph [ref=f2e91]: Foundations sized for three stories, water lines sized for a city block, electric mains ready for the EV future. We build once and we build right.

    - generic [ref=f2e36]:
      - generic [ref=f2e37]:
        - paragraph [ref=f2e38]: Our Vision
        - heading "We build where others won't." [level=3] [ref=f2e39]
        - paragraph [ref=f2e40]: "\"The good land is never the obvious land. We look past the highway, past the brand name, past the brochure, and we walk the site ourselves.\""
        - paragraph [ref=f2e41]: Speed Infra has been turning overlooked parcels into working neighborhoods near Hyderabad for over a decade. We do this slowly, one site at a time, with the same team from foundation to handover.
        - paragraph [ref=f2e42]: When you walk into one of our communities, the road is paved, the water runs, and the lights are on. That is the only proof we offer.
        - paragraph [ref=f2e43]: The Speed Infra team
      - img "A Speed Infra community at first light, viewed from above" [ref=f2e46]
    - generic [ref=f2e47]:
      - generic [ref=f2e48]:
        - paragraph [ref=f2e49]: How we build
        - heading "Three steps. No surprises." [level=2] [ref=f2e50]
        - paragraph [ref=f2e51]: From the first walk across a bare field to the day you collect your keys, the same team carries the work.
      - generic [ref=f2e52]:
        - article [ref=f2e53]:
          - generic [ref=f2e54]: "01"
          - generic [ref=f2e55]:
            - heading "Scout the land" [level=3] [ref=f2e56]
            - paragraph [ref=f2e57]: We walk the site in the rain, check the borewells, time the drive to the airport. If the answer to any of those is wrong, we walk away.
        - article [ref=f2e58]:
          - generic [ref=f2e59]: "02"
          - generic [ref=f2e60]:
            - heading "Draw the plan twice" [level=3] [ref=f2e61]
            - paragraph [ref=f2e62]: Plans get drawn once, then redrawn. Road width, water line, sun angle, parking. The blueprint you sign is the second one, and it is the one we trust.
        - article [ref=f2e63]:
          - generic [ref=f2e64]: "03"
          - generic [ref=f2e65]:
            - heading "Build with one crew" [level=3] [ref=f2e66]
            - paragraph [ref=f2e67]: One site, one supervisor, one crew. The same hands that poured the foundation hand you the keys. We send photos every Friday until handover day.
    - generic [ref=f2e68]:
      - generic [ref=f2e69]:
        - paragraph [ref=f2e70]: What we do not compromise
        - heading "Three quiet promises." [level=2] [ref=f2e71]
      - generic [ref=f2e72]:

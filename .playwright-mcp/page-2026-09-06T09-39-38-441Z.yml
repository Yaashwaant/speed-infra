        - paragraph [ref=e49]: How we build
        - heading "Three steps. No surprises." [level=2] [ref=e50]
        - paragraph [ref=e51]: From the first walk across a bare field to the day you collect your keys, the same team carries the work.
      - generic [ref=e52]:
        - article [ref=e53]:
          - generic [ref=e54]: "01"
          - generic [ref=e55]:
            - heading "Scout the land" [level=3] [ref=e56]
            - paragraph [ref=e57]: We walk the site in the rain, check the borewells, time the drive to the airport. If the answer to any of those is wrong, we walk away.
        - article [ref=e58]:
          - generic [ref=e59]: "02"
          - generic [ref=e60]:
            - heading "Draw the plan twice" [level=3] [ref=e61]
            - paragraph [ref=e62]: Plans get drawn once, then redrawn. Road width, water line, sun angle, parking. The blueprint you sign is the second one, and it is the one we trust.
        - article [ref=e63]:
          - generic [ref=e64]: "03"
          - generic [ref=e65]:
            - heading "Build with one crew" [level=3] [ref=e66]
            - paragraph [ref=e67]: One site, one supervisor, one crew. The same hands that poured the foundation hand you the keys. We send photos every Friday until handover day.

        - paragraph [ref=e38]: Our Vision
        - heading "We build where others won't." [level=3] [ref=e39]
        - paragraph [ref=e40]: "\"The good land is never the obvious land. We look past the highway, past the brand name, past the brochure, and we walk the site ourselves.\""
        - paragraph [ref=e41]: Speed Infra has been turning overlooked parcels into working neighborhoods near Hyderabad for over a decade. We do this slowly, one site at a time, with the same team from foundation to handover.
        - paragraph [ref=e42]: When you walk into one of our communities, the road is paved, the water runs, and the lights are on. That is the only proof we offer.
        - paragraph [ref=e43]: The Speed Infra team
      - img "A Speed Infra community at first light, viewed from above" [ref=e46]
    - generic [ref=e47]:
